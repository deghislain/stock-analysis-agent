# nginx configuration for the Stock Analysis Agent frontend.
#
# This file is placed at /etc/nginx/conf.d/default.conf inside the container
# (the parent /etc/nginx/nginx.conf includes conf.d/*.conf automatically).
#
# Responsibilities:
#   1. Serve the Vite-compiled static bundle from /usr/share/nginx/html.
#   2. Proxy all /api/* requests to the FastAPI backend container.
#   3. SPA fallback — any unknown path returns index.html for React Router.
#   4. Correct cache headers — immutable for hashed assets, no-cache for index.html.
#   5. Runtime gzip compression for text responses.

server {
    listen 80;
    server_name _;

    # ── Docker DNS resolver ────────────────────────────────────────────────────
    # Docker's embedded DNS server at 127.0.0.11.
    # Storing the upstream in a variable (see /api/ block below) forces nginx to
    # resolve the name at request time via this resolver, preventing the
    # "host not found in upstream" crash that occurs when nginx starts before the
    # backend container has registered its name.
    resolver 127.0.0.11 valid=5s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    # Runtime compression for text-based responses (HTML, JS, CSS, JSON).
    # gzip_static serves pre-compressed .gz sidecar files when they exist;
    # gzip compresses on the fly for everything else.
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Request size ──────────────────────────────────────────────────────────
    # Analyse requests carry a small JSON body (just a ticker string), so 1 MB
    # is generous.  Raise this if you later accept file uploads.
    client_max_body_size 1m;

    # ── Hashed static assets (JS, CSS, fonts, images) ─────────────────────────
    # Vite names every output file with a content hash (e.g. index-BIiP8b9R.js).
    # A hash change means a new URL, so these files can be cached forever.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
        try_files          $uri =404;
    }

    # ── index.html — must never be cached ─────────────────────────────────────
    # index.html is the SPA entry point and is NOT content-hashed by Vite.
    # Browsers must always revalidate it so they pick up new asset filenames
    # after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        expires    0;
        try_files  $uri =404;
    }

    # ── API proxy ──────────────────────────────────────────────────────────────
    # Forward /api/* to the FastAPI backend container (service name "backend",
    # port 8000 on the Docker Compose network).
    #
    # The upstream address is stored in a variable so nginx resolves it via the
    # Docker DNS resolver above at request time rather than at startup.
    #
    # proxy_buffering off — lets nginx stream the response bytes directly to
    # the client without first buffering the whole body in memory.  This is
    # important for large PDF downloads: without it nginx would buffer the
    # entire file before forwarding, wasting memory and delaying the download.
    #
    # proxy_request_buffering off — forward the request body to the upstream
    # as it arrives rather than buffering it first.  Safe for our small JSON
    # payloads and forward-compatible with any future larger uploads.
    location /api/ {
        set $backend_upstream http://backend:8000;

        proxy_pass                  $backend_upstream;
        proxy_http_version          1.1;

        proxy_buffering             off;
        proxy_request_buffering     off;

        # Pass the real client address and protocol to uvicorn.
        # uvicorn is started with --proxy-headers --forwarded-allow-ips '*'
        # so it will trust and parse these headers.
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Generous timeouts: the analysis pipeline can take 30–60 s; PDF
        # downloads can be several MB on a slow connection.
        proxy_connect_timeout   10s;
        proxy_read_timeout      120s;
        proxy_send_timeout      120s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router handles all client-side routes.  Any URL that does not match
    # a static file is served as index.html so the browser can boot React and
    # let the router decide what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
