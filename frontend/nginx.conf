# nginx configuration for the Stock Analysis Agent frontend.
#
# Serves the Vite-compiled static files and proxies all /api/* requests to
# the FastAPI backend container so both the frontend and backend are accessible
# through a single port (80) in production.

server {
    listen 80;
    server_name _;

    # Root directory where Vite places the compiled bundle.
    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets ─────────────────────────────────────────────────────────
    # Serve pre-compressed .gz files automatically when the browser accepts
    # gzip encoding (modern browsers always do).
    gzip_static on;

    # Long-lived cache for hashed asset files (JS/CSS bundles named with a
    # content hash by Vite, e.g. index-DJL0pdcn.js).
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API proxy ──────────────────────────────────────────────────────────────
    # Forward /api/* to the backend container.  The service name "backend"
    # resolves via Docker Compose's internal DNS.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large PDF downloads without nginx timing out.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # React Router handles all routes client-side.  Any URL that does not match
    # a static file must be served as index.html so the browser can boot React
    # and let the router decide what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
