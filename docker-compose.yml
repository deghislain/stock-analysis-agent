# ─────────────────────────────────────────────────────────────────────────────
# Stock Analysis Agent — Docker Compose
#
# Services:
#   backend  — FastAPI / uvicorn (Python 3.12, port 8000)
#   frontend — React + nginx    (port 80 in container, exposed on host port 5173)
#
# Quick start:
#   cp .env.example .env          # fill in GROQ_API_KEY (required)
#   docker compose up --build     # first run — builds both images
#   docker compose up             # subsequent runs
#   docker compose down           # stop containers (PDFs are preserved in the
#                                 # named volume "pdf_reports"; portfolio data
#                                 # in "db_data")
#   docker compose down -v        # stop AND delete both named volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI + uvicorn) ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-agent-backend
    restart: unless-stopped
    # Run as root so the named volumes (pdf_reports, db_data) are writable
    # regardless of how Docker initialised their ownership.  This is acceptable
    # for a local single-user development tool.  Remove this line and add a
    # proper entrypoint chown for production deployments.
    user: root

    # Load secrets and settings from the .env file.
    # required: false — lets Compose start (with a warning) on a fresh clone
    # before the user has created .env, so the environment: block below still
    # applies.  The app will error loudly only if GROQ_API_KEY is missing at
    # request time, not at container startup.
    env_file:
      - path: .env
        required: false

    environment:
      # Override the default PDF output dir to the named volume mount point.
      # This must match the target path in the volumes: section below.
      PDF_OUTPUT_DIR: /app/pdf_reports
      # Store the portfolio SQLite database on the db_data named volume so it
      # survives container restarts and rebuilds.  Four slashes are required for
      # an absolute path in a SQLite URL: sqlite:////absolute/path/to/file.db
      DATABASE_URL: sqlite:////app/data/portfolios.db

    ports:
      - "8000:8000"

    volumes:
      # Named volume — Docker manages ownership so the non-root appuser inside
      # the container can write PDFs without permission errors.
      # A bind-mount (./backend/app/pdf_reports:/app/pdf_reports) would be
      # owned by root on the host and cause PermissionError at runtime.
      - pdf_reports:/app/pdf_reports
      # Named volume for the portfolio SQLite database.  Kept separate from
      # pdf_reports so wiping one does not affect the other.
      - db_data:/app/data

    healthcheck:
      # Pure-Python HTTP check — guaranteed available in python:3.12-slim with
      # no extra packages.  Raises an exception (non-zero exit) on any non-200
      # response so Docker correctly marks the container unhealthy.
      test:
        - "CMD"
        - "python"
        - "-c"
        - |
          import urllib.request, sys
          res = urllib.request.urlopen('http://localhost:8000/health', timeout=5)
          sys.exit(0 if res.status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - stock-agent-net

  # ── Frontend (React + nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-agent-frontend
    restart: unless-stopped

    ports:
      # Access the app at http://localhost:5173 on the host.
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      # wget ships with nginx:alpine; checks that nginx is serving the index page.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - stock-agent-net

# ── Named volumes ─────────────────────────────────────────────────────────────
# Docker manages these volumes; they persist data across container restarts and
# rebuilds.  Remove them explicitly with: docker compose down -v
volumes:
  pdf_reports:
  db_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  stock-agent-net:
    driver: bridge
