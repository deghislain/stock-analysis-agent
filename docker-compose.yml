# ─────────────────────────────────────────────────────────────────────────────
# Stock Analysis Agent — Docker Compose
#
# Services:
#   backend  — FastAPI (Python 3.12, port 8000)
#   frontend — React + nginx (port 80 in container, exposed on host port 5173)
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up                  # subsequent runs
#   docker compose down -v             # stop and remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock-agent-backend
    restart: unless-stopped
    env_file:
      # .env is git-ignored; copy from .env.example and fill in your values.
      - .env
    environment:
      # These can also be overridden here without touching .env.
      - PDF_OUTPUT_DIR=/app/pdf_reports
    ports:
      - "8000:8000"
    volumes:
      # Persist generated PDFs across container restarts.
      - pdf_reports:/app/pdf_reports
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - stock-agent-net

  # ── Frontend (React + nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-agent-frontend
    restart: unless-stopped
    ports:
      # Access the app at http://localhost:5173 on the host.
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stock-agent-net

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  pdf_reports:
    # External: false — Docker manages this volume automatically.
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  stock-agent-net:
    driver: bridge
